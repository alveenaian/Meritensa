server {
  listen 8000;
  server_name localhost;

  client_max_body_size 1G;

  location / {
    proxy_pass http://app:3000/;

    absolute_redirect off;

    chunked_transfer_encoding off;

    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;

    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Security Headers
    # X-Frame-Options removed - using CSP frame-ancestors instead (more flexible and modern)
    add_header X-Content-Type-Options 'nosniff' always;
    add_header X-XSS-Protection '1; mode=block' always;
    add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains' always;
    add_header Referrer-Policy 'strict-origin-when-cross-origin' always;
    add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
    
    # Content Security Policy - allows same-origin and common CDNs for development
    # frame-ancestors updated to allow TrySolid preview iframe embedding
    # In production, this should be tightened to specific domains
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'self' https://*.codapt.app https://trysolid.com https://*.trysolid.com;" always;

    # CORS Headers - In development, allow localhost origins
    # In production, replace with your actual domain from BASE_URL environment variable
    # For now, using permissive settings for development
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header Access-Control-Allow-Headers 'Content-Type, Authorization' always;
    add_header Access-Control-Allow-Credentials 'true' always;
    add_header Access-Control-Max-Age '86400' always;

    # Handle preflight requests
    if ($request_method = 'OPTIONS') {
      add_header Access-Control-Allow-Origin $http_origin always;
      add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
      add_header Access-Control-Allow-Headers 'Content-Type, Authorization' always;
      add_header Access-Control-Allow-Credentials 'true' always;
      add_header Access-Control-Max-Age '86400' always;
      add_header Content-Length 0;
      return 204;
    }
  }

  location /codapt/db/ {
    proxy_pass http://adminer:8080/;

    absolute_redirect off;

    chunked_transfer_encoding off;

    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;

    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    auth_basic "admin";
    auth_basic_user_file /etc/nginx/.htpasswd/htpasswd;

    # Security Headers for admin panel too
    # X-Frame-Options removed - using CSP frame-ancestors instead (more flexible and modern)
    add_header X-Content-Type-Options 'nosniff' always;
    add_header X-XSS-Protection '1; mode=block' always;
  }
}
